name: AirCard-iOS
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "1.3.1"
    TARGETED_DEVICE_FAMILY: "1"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AirCard-iOS:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - "Assets.xcassets"
          - "Assets.xcassets/**"
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "AirCard-iOS"
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.aircard
        INFOPLIST_FILE: ios-app/Info.plist
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: "ios-app/Andromeda-Bridging-Header.h"
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: "ios-app/Andromeda.entitlements"
  AirCard-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: AirCard-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.aircard.tests

schemes:
  AirCard-iOS:
    build:
      targets:
        AirCard-iOS: all
    test:
      targets:
        - AirCard-iOSTests